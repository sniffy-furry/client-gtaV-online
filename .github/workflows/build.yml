name: build-libmpclient
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build and run end-to-end test (two clients + server, simulated game)
        run: |
          g++ -std=c++17 -O1 -pthread test/host_test.cpp src/client.cpp src/client_game.cpp -o /tmp/host_test
          SERVER_DIR=$PWD/server sh test/run_host_test.sh
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r26d }
      - name: Configure
        run: |
          cmake -S . -B build -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Strip
        run: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded build/libmpclient.so
      - uses: actions/upload-artifact@v4
        with: { name: libmpclient-arm64-v8a, path: build/libmpclient.so }
      - name: Patch the APK (needs base/XHYNMP_base.apk in the repo and the secret MPMOD_KEY_PEM)
        if: hashFiles('base/XHYNMP_base.apk') != ''
        env:
          KEY_PEM: ${{ secrets.MPMOD_KEY_PEM }}
        run: |
          pip install cryptography py7zr
          [ -n "$KEY_PEM" ] && printf '%s' "$KEY_PEM" > /tmp/mpmod.key.pem || echo "no MPMOD_KEY_PEM secret: a NEW signing key is generated (uninstall the old app before installing)"
          python3 tools/patchapk.py base/XHYNMP_base.apk build/libmpclient.so XHYNMP_mp5.apk /tmp/mpmod.key.pem com.xhynph.xhynv.mpmod4 com.xhynph.xhynv.mpmod5
          python3 -c "import py7zr; z=py7zr.SevenZipFile('XHYNMP_mp5.7z','w',filters=[{'id':py7zr.FILTER_LZMA2,'preset':9}]); z.write('XHYNMP_mp5.apk'); z.close()"
      - uses: actions/upload-artifact@v4
        if: hashFiles('XHYNMP_mp5.7z') != ''
        with: { name: XHYNMP-mp5-patched, path: XHYNMP_mp5.7z, compression-level: 0 }
